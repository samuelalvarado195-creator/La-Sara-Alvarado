name: Compilar APK Android

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar librerias del sistema Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libzbar0 libgl1-mesa-dev

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Diagnostico de Flutter
        run: flutter doctor -v

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install flet openpyxl opencv-python-headless pyzbar

      - name: Compilar APK
        run: |
          flet build apk -v

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: DondeLaSarita_APK
          path: build/apk/*.apk
